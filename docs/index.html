<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>창작소 — PC</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./creative.css"><link rel="stylesheet" href="./stage4.css?v=pc4-sns-3"><script src="./storage.js?v=pc4-sns-3" defer></script><script src="./app.js" defer></script><script src="./creative-media-store.js" defer></script><script src="./creative.js" defer></script><script src="./sns.js?v=pc4-sns-3" defer></script><script src="./stage4.js?v=pc4-sns-3" defer></script></head>
<body><div class="app-shell">
<header class="topbar"><div class="brand">✦ <span>창작소</span></div><div class="backup-actions"><button id="importBackup" class="button" type="button">백업 가져오기</button><button id="exportBackup" class="button" type="button">백업 내보내기</button></div></header>
<div class="workspace"><aside class="sidebar"><nav class="side-nav"><button class="nav-button active" data-view="projects" type="button">▦ 프로젝트</button><button class="nav-button" data-view="more" type="button">☷ 더보기</button></nav><div class="side-note">창작소 PC</div></aside>
<main class="main-content">
<section data-panel="projects" id="projectsView"><div class="section-heading header-flex"><div><p class="eyebrow">MY WORKSPACE</p><h1>프로젝트</h1><p class="muted">나만의 이야기를 정리하는 공간</p></div><button class="button primary" id="newProject" type="button">+ 새 프로젝트</button></div>
<div class="folder-heading"><h2>폴더</h2><button class="text-button" id="newFolder" type="button">+ 폴더 추가</button><button class="text-button" id="allFolders" type="button">전체 보기</button></div><div id="folderList" class="folder-grid"></div>
<div class="folder-heading project-heading"><h2 id="listTitle">프로젝트 목록</h2><span class="tag" id="projectCount">0개</span></div>
<div class="project-toolbar"><input class="field search" id="projectSearch" type="search" placeholder="프로젝트 이름·설명 검색" aria-label="프로젝트 검색"><select class="field" id="projectSort" aria-label="프로젝트 정렬"><option value="latest">최근 수정순</option><option value="created">최근 생성순</option><option value="name">이름순</option><option value="oldest">오래된순</option></select></div><div class="project-grid" id="projectList"></div></section>
<section data-panel="detail" id="detailView" hidden><button class="text-button" id="backToProjects" type="button">‹ 프로젝트 목록</button><div class="project-detail-head"><div id="detailCover" class="detail-cover"></div><div class="detail-copy"><p class="eyebrow">PROJECT</p><h1 id="detailName"></h1><span class="tag" id="detailType"></span><p class="muted" id="detailDesc"></p><p id="detailFolder"></p><div class="detail-actions"><button class="button" id="editOpenProject" type="button">프로젝트 수정</button><button class="button" id="moveOpenProject" type="button">폴더 이동</button></div></div></div><section class="creative-workspace" id="creativeWorkspace" hidden>
<div class="creative-heading"><div><p class="eyebrow">CREATIVE WORKSPACE</p><h2 id="creativeProjectName"></h2></div><button class="button" id="creativeNew" type="button">+ 추가</button></div>
<div class="creative-original" id="creativeOriginal" hidden><h3>2차창작 · 원작 정보</h3><div class="creative-original-grid"><label class="form-label">원작명<input class="field" id="originalTitle" maxlength="160"></label><label class="form-label">원작 종류<select class="field" id="originalKind"><option value="">종류 미지정</option><option>만화</option><option>애니</option><option>소설</option><option>게임</option><option>영화 / 드라마</option><option>기타</option></select></label><label class="form-label">간단 메모<input class="field" id="originalNote" maxlength="2000"></label></div><button class="button" id="creativeOriginalSave" type="button">원작 정보 저장</button></div>
<nav class="creative-tabs" id="creativeTabs" aria-label="창작 기능"></nav>
<div class="creative-heading"><h2 id="creativeSectionTitle"></h2><small id="creativeCount"></small></div>
<div class="creative-toolbar"><input class="field" id="creativeSearch" type="search" placeholder="이름·내용 검색"><select class="field" id="creativeTag" aria-label="태그 선택"><option value="">전체 태그</option></select><select class="field" id="creativeSort" aria-label="정렬"><option value="latest">최근 수정순</option><option value="created">최근 생성순</option><option value="name">이름순</option><option value="oldest">오래된순</option></select></div>
<div id="creativeList" class="creative-list"></div>
</section><section id="stage4Workspace" hidden></section></section>
<section data-panel="more" id="moreView" hidden><div class="section-heading"><p class="eyebrow">TOOLS & SETTINGS</p><h1>더보기</h1><p class="muted">창작 도구와 환경 설정</p></div><div class="more-grid"><article class="info-card"><h2>✧ 창작 도구</h2><p>창작 기능은 이후 개발 회차에서 순서대로 연결됩니다.</p></article><article class="info-card"><h2>⚙ 설정</h2><p>PC 창작소 설정 화면을 준비 중입니다.</p></article></div></section>
</main></div>
<dialog id="editorDialog" class="editor-dialog"><form id="editorForm"><div class="modal-head"><h2 id="editorTitle"></h2><button id="closeEditor" type="button" aria-label="닫기">×</button></div><div id="editorFields"></div><div class="form-actions"><button class="button" id="cancelEditor" type="button">취소</button><button class="button primary" type="submit">저장</button></div></form></dialog>
<dialog class="creative-dialog" id="creativeEditor"><div class="creative-dialog-head"><h2 id="creativeEditorTitle"></h2><button class="small-button" type="button" id="creativeEditorClose" aria-label="닫기">×</button></div><div class="creative-dialog-content"><form class="creative-editor-form" id="creativeEditorForm"></form><div class="creative-dialog-foot"><button class="button danger-text" type="button" id="creativeEditorDelete">삭제</button><button class="button" type="button" id="creativeEditorCancel">취소</button><button class="button primary" type="submit" form="creativeEditorForm">저장</button></div></div></dialog>
<dialog class="creative-dialog creative-preview-dialog" id="creativePreview"><div class="creative-dialog-head"><h2 id="creativePreviewTitle">미리보기</h2><button class="small-button" type="button" id="creativePreviewClose">닫기</button></div><div id="creativePreviewBody" class="creative-dialog-content"></div></dialog>
<dialog class="creative-dialog creative-media-dialog" id="creativeMedia"><div class="creative-dialog-head"><h2 id="creativeMediaTitle">파일 보기</h2><button class="small-button" type="button" id="creativeMediaClose">닫기</button></div><div class="creative-dialog-content"><div id="creativeMediaBody"></div><p><a class="button" id="creativeDownload">원본 다운로드</a></p></div></dialog><div id="message" role="status" class="toast" hidden></div>
</div></body></html>
